<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concert Countdown - Tap to Reveal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Oswald', sans-serif;
            background: #000;
            overflow: hidden;
            position: relative;
            height: 100vh;
            cursor: pointer;
        }

        /* Tap prompt screen */
        .tap-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a0000 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .tap-screen.hidden {
            opacity: 0;
            transform: scale(1.5);
            pointer-events: none;
        }

        .tap-text {
            color: #ff6b00;
            font-size: 3em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            animation: pulse 2s infinite;
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.8);
        }

        .tap-icon {
            margin-top: 30px;
            width: 60px;
            height: 60px;
            border: 3px solid #ff6b00;
            border-radius: 50%;
            position: relative;
            animation: tapAnimation 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes tapAnimation {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.9); opacity: 0.6; }
        }

        /* Main countdown container */
        .countdown-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        .countdown-container.visible {
            opacity: 1;
        }

        /* Canvas for flame animation */
        #flameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Big 5 number */
        .big-number {
            font-family: 'Bebas Neue', cursive;
            font-size: 45vw;
            font-weight: bold;
            color: transparent;
            position: relative;
            z-index: 10;
            text-shadow:
                0 0 10px rgba(255, 100, 0, 0.8),
                0 0 20px rgba(255, 100, 0, 0.6),
                0 0 30px rgba(255, 100, 0, 0.4),
                0 0 40px rgba(255, 100, 0, 0.3),
                0 0 50px rgba(255, 100, 0, 0.2);
            background: linear-gradient(
                45deg,
                #ff0000,
                #ff4500,
                #ff8c00,
                #ffa500,
                #ffff00,
                #ff4500,
                #ff0000
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: fireGradient 3s ease infinite, flicker 0.1s infinite;
            transform: translateY(-20px);
        }

        @keyframes fireGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        /* Days text */
        .days-text {
            font-size: 3em;
            color: #ff6b00;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            position: relative;
            z-index: 10;
            margin-top: -50px;
            text-shadow:
                0 0 20px rgba(255, 100, 0, 1),
                0 0 40px rgba(255, 100, 0, 0.8),
                0 0 60px rgba(255, 100, 0, 0.6);
            animation: burnText 2s ease-in-out infinite;
        }

        @keyframes burnText {
            0%, 100% {
                transform: translateY(0) scale(1);
                filter: brightness(1);
            }
            50% {
                transform: translateY(-5px) scale(1.05);
                filter: brightness(1.3);
            }
        }

        /* Concert text */
        .concert-text {
            font-size: 1.5em;
            color: #ff4500;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            position: relative;
            z-index: 10;
            margin-top: 20px;
            opacity: 0.9;
            text-shadow:
                0 0 10px rgba(255, 69, 0, 1),
                0 0 20px rgba(255, 69, 0, 0.8);
        }

        /* Particle effects */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #ffff00, #ff4500);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .big-number {
                font-size: 60vw;
            }
            .days-text {
                font-size: 2em;
            }
            .concert-text {
                font-size: 1.2em;
            }
            .tap-text {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <!-- Tap to reveal screen -->
    <div class="tap-screen" id="tapScreen">
        <div class="tap-text">Tap to Reveal</div>
        <div class="tap-icon"></div>
    </div>

    <!-- Main countdown -->
    <div class="countdown-container" id="countdownContainer">
        <canvas id="flameCanvas"></canvas>
        <div class="big-number">5</div>
        <div class="days-text">Days Left</div>
        <div class="concert-text">Until The Concert</div>
    </div>

    <script>
        // Flame animation using Canvas
        class FlameAnimation {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                this.init();

                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                // Create flame particles
                for (let i = 0; i < 150; i++) {
                    this.particles.push(this.createParticle());
                }
            }

            createParticle() {
                return {
                    x: Math.random() * this.canvas.width,
                    y: this.canvas.height + Math.random() * 100,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -Math.random() * 3 - 2,
                    size: Math.random() * 15 + 5,
                    life: 1,
                    decay: Math.random() * 0.02 + 0.005,
                    hue: Math.random() * 60 - 10 // Red to yellow range
                };
            }

            update() {
                this.particles.forEach((particle, index) => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.life -= particle.decay;
                    particle.size *= 0.98;

                    // Add turbulence
                    particle.vx += (Math.random() - 0.5) * 0.5;

                    // Reset dead particles
                    if (particle.life <= 0 || particle.y < -50) {
                        this.particles[index] = this.createParticle();
                    }
                });
            }

            draw() {
                // Create gradient background
                const gradient = this.ctx.createLinearGradient(0, this.canvas.height, 0, 0);
                gradient.addColorStop(0, 'rgba(0, 0, 0, 0.05)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw particles
                this.particles.forEach(particle => {
                    this.ctx.save();
                    this.ctx.globalAlpha = particle.life;

                    // Create radial gradient for each particle
                    const particleGradient = this.ctx.createRadialGradient(
                        particle.x, particle.y, 0,
                        particle.x, particle.y, particle.size
                    );

                    const hue = 30 + particle.hue;
                    const saturation = 100;
                    const lightness = 50 + particle.life * 30;

                    particleGradient.addColorStop(0, `hsla(${hue}, ${saturation}%, ${lightness}%, 1)`);
                    particleGradient.addColorStop(0.4, `hsla(${hue}, ${saturation}%, ${lightness - 10}%, 0.5)`);
                    particleGradient.addColorStop(1, `hsla(${hue}, ${saturation}%, ${lightness - 20}%, 0)`);

                    this.ctx.fillStyle = particleGradient;
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Add glow effect
                    this.ctx.shadowBlur = 20;
                    this.ctx.shadowColor = `hsla(${hue}, 100%, 50%, ${particle.life})`;
                    this.ctx.fill();

                    this.ctx.restore();
                });
            }

            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        // Spark particles around the number
        function createSpark() {
            const spark = document.createElement('div');
            spark.className = 'particle';

            const startX = window.innerWidth / 2 + (Math.random() - 0.5) * 300;
            const startY = window.innerHeight / 2 + (Math.random() - 0.5) * 200;

            spark.style.left = startX + 'px';
            spark.style.top = startY + 'px';

            document.getElementById('countdownContainer').appendChild(spark);

            const duration = Math.random() * 2000 + 1000;
            const deltaX = (Math.random() - 0.5) * 200;
            const deltaY = -Math.random() * 300 - 100;

            spark.animate([
                {
                    transform: 'translate(0, 0) scale(1)',
                    opacity: 1
                },
                {
                    transform: `translate(${deltaX}px, ${deltaY}px) scale(0)`,
                    opacity: 0
                }
            ], {
                duration: duration,
                easing: 'ease-out'
            }).onfinish = () => spark.remove();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const tapScreen = document.getElementById('tapScreen');
            const countdownContainer = document.getElementById('countdownContainer');
            const canvas = document.getElementById('flameCanvas');

            // Handle tap/click
            tapScreen.addEventListener('click', () => {
                tapScreen.classList.add('hidden');

                setTimeout(() => {
                    countdownContainer.classList.add('visible');

                    // Start flame animation
                    const flameAnim = new FlameAnimation(canvas);
                    flameAnim.animate();

                    // Start creating sparks
                    setInterval(createSpark, 100);

                    // Add screen shake effect on reveal
                    document.body.style.animation = 'shake 0.5s';
                    setTimeout(() => {
                        document.body.style.animation = '';
                    }, 500);
                }, 800);
            });
        });

        // Screen shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
